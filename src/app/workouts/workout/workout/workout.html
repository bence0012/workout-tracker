<section id="workout">
    <header>
        <div class="header">
            <h1>Muscle Groups:</h1>
        </div>
        <h2>
            <time id="date">{{workout.date | date:'short':'UTC'}}</time>
        </h2> 
    </header>
    <div class="groups">
        @for (item of workout.main_muscle_groups; track $index) {
            @if (selected) {
                <h3 (click)="removeGroup(item)">{{item.name}}</h3>
            } @else {
                <h3>{{item.name}}</h3>
            }
        }
    @if (selected) {
        <select [ngModel] = "selectedGroup" (ngModelChange)="addGroup({name: $event})" name="sel2">
            @for(item of MGroups; track $index){
                <option [value]=item.name>{{item.name}}</option>
            }
        </select>
    }
    </div>
    @if (selected) {
        @for (item of workout.exercises; track $index) {
            <app-exercise-component [exercise]="item" [types]="types" (delete)="deleteExercise(item)"/>
        }
        <button (click)="addExercise()">+</button>
    }
    
</section>
